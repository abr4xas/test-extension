<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        margin: 0;
        padding: 10px 14px 12px;
        width: 260px;
        background: #1a1408;
        color: #e8e8e8;
        font: 13px/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        color: #f4d795;
        font-size: 14px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 0;
        cursor: pointer;
      }
      input {
        margin: 0;
        accent-color: #f4d795;
      }
      h2 {
        margin: 12px 0 6px;
        padding-top: 10px;
        border-top: 1px solid #4a3c1c;
        color: #f4d795;
        font-size: 13px;
      }
      #warp {
        display: flex;
        gap: 6px;
      }
      select {
        flex: 1;
        min-width: 0;
        padding: 3px 4px;
        border: 1px solid #6b5626;
        border-radius: 4px;
        background: #2a2010;
        color: #e8e8e8;
        font: inherit;
      }
      #warp-status {
        margin: 6px 0 0;
        color: #aaa;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>OpenMU Auto Reset</h1>
    <form id="settings"></form>
    <h2>Warp</h2>
    <form id="warp" hidden>
      <select id="warp-map">
        <option value="" selected disabled>Choose a map…</option>
      </select>
    </form>
    <p id="warp-status">Open the game in this tab to warp.</p>
    <script src="../settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
